<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Off Watch — tijd instellen</title>
<style>
  :root {
    --bg: #0b0b0b; --fg: #f2f2f2; --dim: #8a8a8a; --accent: #e8322b; --ok: #3ec46d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .face {
    aspect-ratio: 1; width: 100%; max-width: 320px; margin: 0 auto 28px;
    background: #000; border: 14px solid #f4f4f0; border-radius: 34px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #clock { font-size: clamp(48px, 17vw, 76px); letter-spacing: 2px; }
  #sec { color: var(--dim); font-size: 18px; margin-top: 6px; }
  #tz { color: var(--dim); font-size: 13px; margin-top: 14px; padding: 0 12px; }
  button {
    font: inherit; font-size: 17px; width: 100%;
    padding: 16px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.4em; margin: 16px 0 0; color: var(--dim); font-size: 14px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--accent); }
  footer { margin-top: 32px; font-size: 12px; color: var(--dim); }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <div class="face">
    <div id="clock">--:--</div>
    <div id="sec">:--</div>
    <div id="tz"></div>
  </div>

  <button id="sync">Verbind met horloge</button>
  <p id="status"></p>

  <footer>
    Ring Off Watch · <a href="https://audiocollages.com">audiocollages.com</a><br>
    Werkt in Chrome of Edge (Android, Windows, macOS, Linux).<br>
    iPhone: gebruik de app Bluefy.
  </footer>
</main>

<script>
const SERVICE = "7a1e0001-5f3b-4c1a-9b2e-6d0a2c7e1f00";
const CHAR    = "7a1e0002-5f3b-4c1a-9b2e-6d0a2c7e1f00";

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

$("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || "";

function tick() {
  const d = new Date();
  $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("sec").textContent = ":" + pad(d.getSeconds());
}
tick();
setInterval(tick, 250);

function status(msg, cls) {
  const s = $("status");
  s.textContent = msg;
  s.className = cls || "";
}

if (!navigator.bluetooth) {
  $("sync").disabled = true;
  status("Deze browser ondersteunt geen Bluetooth. Gebruik Chrome of Edge.", "err");
}

$("sync").addEventListener("click", async () => {
  const btn = $("sync");
  btn.disabled = true;
  try {
    status("Zoeken naar het horloge…");
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "RING OFF" }, { services: [SERVICE] }],
      optionalServices: [SERVICE]
    });

    status("Verbinden met " + (device.name || "horloge") + "…");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    const ch = await service.getCharacteristic(CHAR);

    // wacht tot het begin van de volgende seconde, zodat het horloge precies loopt
    await new Promise(r => setTimeout(r, 1000 - new Date().getMilliseconds()));
    const d = new Date();
    const txt = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    await ch.writeValue(new TextEncoder().encode(txt));

    status("Tijd ingesteld: " + txt, "ok");
    setTimeout(() => { try { device.gatt.disconnect(); } catch (e) {} }, 500);
  } catch (e) {
    if (e && e.name === "NotFoundError") status("Geen horloge gekozen.", "err");
    else status("Mislukt: " + (e && e.message ? e.message : e), "err");
  } finally {
    btn.disabled = !navigator.bluetooth;
  }
});
</script>
</body>
</html>
